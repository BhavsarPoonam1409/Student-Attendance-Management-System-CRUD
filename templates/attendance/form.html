<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | AttendEase</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f1efff, #f8f9ff);
            font-family: 'Inter', sans-serif;
            color: #292c48;
        }

        .form-card {
            width: 100%;
            max-width: 530px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            border: 1px solid #ecebf6;
            box-shadow: 0 20px 60px rgba(61, 56, 120, 0.09);
        }

        .icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #efedff;
            font-size: 25px;
            margin-bottom: 23px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9295aa;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 9px;
            color: #555873;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e5e5f0;
            border-radius: 10px;
            background: #fcfcff;
            color: #292c48;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #8175eb;
            box-shadow: 0 0 0 3px rgba(97, 85, 217, 0.10);
        }

        .helptext {
            display: block;
            color: #999bb0;
            font-size: 11px;
            margin-top: 6px;
        }

        .errorlist {
            color: #d94f61;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 27px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .save {
            background: #6155d9;
            color: white;
        }

        .save:hover {
            background: #5045c4;
        }

        .cancel {
            background: #f2f2fa;
            color: #656881;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="icon">✦</div>

        <h1>{{ title }}</h1>

        <p class="subtitle">
            Enter the required details below and save your information.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">

                <a href="{% url 'home' %}" class="btn cancel">
                    Cancel
                </a>

                <button type="submit" class="btn save">
                    Save Details →
                </button>

            </div>
        </form>

    </div>

</body>
</html>
