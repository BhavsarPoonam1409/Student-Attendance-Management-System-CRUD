<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>
<body>

    <h2>{{ title }}</h2>

    <p>Are you sure you want to delete this record?</p>

    <form method="POST">

        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'home' %}">Cancel</a>

</body>
</html>
